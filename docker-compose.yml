version: '3.8'

services:
  # 1. Database Storage Service
  db:
    image: postgres:15-alpine
    container_name: flipkart_tracker_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: flipkart_tracker
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flipkart_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Queue & Cache Storage Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: flipkart_tracker_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Express API & Scraper Service (Playwright)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flipkart_tracker_api
    restart: always
    ipc: host
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/flipkart_tracker?schema=public
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Kolkata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Static Nginx Web Server Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api # Set to your VPS IP or public domain if deploying online
    container_name: flipkart_tracker_client
    restart: always
    ports:
      - "8080:80" # Maps port 8080 of the host to port 80 of the container
    depends_on:
      - backend

volumes:
  pgdata:
  redis_data:

